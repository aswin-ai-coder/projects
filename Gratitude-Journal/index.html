<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe6"><meta name="description" content="A private, local-first gratitude journal for noticing, remembering and reflecting on what matters."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Gratitude Journal</title></head>
<body><header class="top"><div class="brand"><div class="mark">✦</div><div><strong>Gratitude Journal</strong><small id="dateLabel"></small></div></div><div class="top-actions"><button id="themeBtn" class="icon" title="Theme">◐</button><button id="studioBtn" class="secondary">Studio</button><button id="newBtn" class="primary">+ Gratitude</button></div></header>
<main><section class="hero"><div><p class="eyebrow">A SMALL PRACTICE</p><h1 id="heroTitle">What are you grateful for today?</h1><p class="sub">Notice one thing. A sentence is enough.</p></div><div class="streak"><b id="streak">0</b><span>day practice</span></div></section>
<section class="quick-grid"><button class="quick" data-quick="tiny"><b>✦ One thing</b><span>Capture a tiny gratitude</span></button><button class="quick" data-quick="three"><b>3 Good Things</b><span>A simple three-part ritual</span></button><button class="quick" data-quick="people"><b>♡ Someone</b><span>Appreciate a person</span></button><button class="quick" data-quick="prompt"><b>?</b><span>Give me a prompt</span></button></section>
<nav id="tabs" class="tabs"><button data-view="today">Today</button><button data-view="timeline">Journal</button><button data-view="calendar">Calendar</button><button data-view="memories">Memories</button><button data-view="insights">Insights</button></nav>
<section class="toolbar"><input id="search" placeholder="Search gratitude, people, places, tags…"><select id="period"><option value="30">30 days</option><option value="90">90 days</option><option value="365">Year</option><option value="all">All time</option></select><button id="randomBtn" class="secondary">Random memory</button></section><section id="view"></section><section id="stats" class="stats"></section></main>
<dialog id="entryDialog"><form method="dialog" id="entryForm"><div class="modal-head"><div><p class="eyebrow">GRATITUDE NOTE</p><h2 id="modalTitle">New gratitude</h2></div><button type="button" data-close>×</button></div><input type="hidden" id="entryId"><label>Date & time<input id="entryDate" type="datetime-local" required></label><label>What are you grateful for?<textarea id="note" rows="7" required placeholder="I’m grateful for…"></textarea></label><div class="prompt-box" id="promptBox"></div><div class="form-grid"><label>Person / people<input id="people" placeholder="Optional"></label><label>Place<input id="place" placeholder="Optional"></label><label>Category<select id="category"><option>People</option><option>Moments</option><option>Nature</option><option>Health</option><option>Learning</option><option>Work</option><option>Home</option><option>Simple pleasures</option><option>Other</option></select></label><label>Mood<select id="mood"><option value="5">Wonderful</option><option value="4">Good</option><option value="3">Okay</option><option value="2">Low</option><option value="1">Hard</option></select></label></div><label>Why does this matter to you?<textarea id="why" rows="3" placeholder="Optional — what makes this meaningful?"></textarea></label><label>How could you savor or pass this gratitude forward?<textarea id="impact" rows="3" placeholder="Optional — notice, appreciate, thank, help, or revisit…"></textarea></label><label>Tags<input id="tags" placeholder="family, sunlight, progress"></label><label>Photos, audio or other files<input id="mediaFiles" type="file" multiple accept="image/*,audio/*,video/*,.pdf,.txt,.md"></label><div id="existingMedia" class="media-list"></div><label class="check"><input id="favorite" type="checkbox"> Keep this in Memories</label><div class="modal-actions"><button type="button" id="deleteEntry" class="danger">Delete</button><span></span><button type="button" data-close class="secondary">Cancel</button><button class="primary">Save gratitude</button></div></form></dialog>
<dialog id="studioDialog"><div class="studio"><div class="modal-head"><div><p class="eyebrow">GRATITUDE STUDIO</p><h2>Practice, patterns & memories</h2></div><button data-close>×</button></div><nav class="studio-tabs"><button data-studio="overview">Overview</button><button data-studio="prompts">Prompts</button><button data-studio="rituals">Rituals</button><button data-studio="insights">Insights</button><button data-studio="letters">Appreciation</button><button data-studio="goals">Goals</button><button data-studio="data">Data</button></nav><div id="studioContent"></div></div></dialog><div id="toast" class="toast"></div>
<script src="app.js"></script><script src="media.js"></script><script src="advanced.js"></script><script>document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close())</script></body></html>
