<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5dfc"><meta name="description" content="A private, local-first digital diary for everyday memories, reflections and moments."><title>Digital Diary</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark">D</div><div><strong>Digital Diary</strong><span>your days, your story</span></div></div><div class="top-actions"><button class="icon-btn" id="themeBtn" aria-label="Change theme">◐</button><button class="icon-btn" id="studioBtn" aria-label="Open Diary Studio">⌘</button><button class="primary" id="newBtn">+ New entry</button></div></header><main class="shell"><section class="hero"><div><p class="eyebrow" id="todayLabel">TODAY</p><h1 id="heroTitle">Write your day down.</h1><p class="hero-copy">A calm, private place for moments, thoughts, photos and memories.</p></div><div class="day-ring" aria-label="Entries today"><span id="dayScore">0</span><small>entries</small></div></section><section class="quick-grid"><button class="quick-card" data-action="moment"><span>✦</span><strong>Quick moment</strong><small>Capture something now</small></button><button class="quick-card" data-action="reflection"><span>◌</span><strong>Daily reflection</strong><small>Mood, energy & highlights</small></button><button class="quick-card" data-action="memory"><span>▣</span><strong>Memory</strong><small>Save a lasting moment</small></button><button class="quick-card" data-action="prompt"><span>?</span><strong>Use a prompt</strong><small>Never face a blank page</small></button></section><section class="toolbar"><div class="tabs" id="tabs"><button class="active" data-view="timeline">Timeline</button><button data-view="calendar">Calendar</button><button data-view="memories">Memories</button><button data-view="favorites">Favorites</button></div><div class="tools"><input id="search" type="search" aria-label="Search diary" placeholder="Search diary… (Ctrl/⌘ K)"><select id="sort" aria-label="Sort entries"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="favorite">Favorites first</option></select></div></section><section id="view"></section><section class="insight-strip" id="insights"></section></main><dialog id="entryDialog" class="modal" aria-labelledby="modalTitle"><form method="dialog" id="entryForm"><div class="modal-head"><div><p class="eyebrow">DIARY ENTRY</p><h2 id="modalTitle">New entry</h2></div><button type="button" class="icon-btn" data-close aria-label="Close editor">×</button></div><input type="hidden" id="entryId"><div class="form-grid"><label>Date & time<input id="entryDate" type="datetime-local" required></label><label>Diary<select id="entryJournal"></select></label><label>Title<input id="entryTitle" maxlength="160"></label><label>Mood<select id="entryMood"><option value="">Choose mood</option><option>😊 Great</option><option>🙂 Good</option><option>😌 Calm</option><option>😐 Neutral</option><option>😕 Low</option><option>😣 Stressed</option><option>😴 Tired</option><option>🤩 Excited</option></select></label><label>Energy<input id="entryEnergy" type="range" min="1" max="10" value="5"><span id="energyValue">5/10</span></label><label>Weather<input id="entryWeather"></label><label>Location<input id="entryLocation"></label><label>Tags<input id="entryTags" placeholder="school, friends, idea"></label><label class="check-filter"><input id="entryPrivate" type="checkbox"> Private entry</label></div><label>What happened?<textarea id="entryBody" rows="10"></textarea></label><div class="editor-tools" aria-label="Formatting tools"><button type="button" data-format="bold"><b>B</b></button><button type="button" data-format="italic"><i>I</i></button><button type="button" data-format="heading">H</button><button type="button" data-format="list">☷</button><button type="button" data-format="quote">❝</button><button type="button" data-format="check">☑</button></div><div class="media-box"><div><strong>Attachments</strong><small>Add images, audio, video or files. Stored locally in this browser.</small></div><input id="entryFiles" type="file" multiple accept="image/*,audio/*,video/*,.pdf,.txt,.md,.doc,.docx"></div><div id="existingMedia" class="media-list"></div><div class="modal-foot"><button type="button" class="danger ghost" id="deleteEntry">Delete</button><span></span><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save entry</button></div></form></dialog><div id="toast" class="toast" aria-live="polite"></div><script src="app.js"></script><script src="advanced.js"></script><script src="media.js"></script></body></html>
