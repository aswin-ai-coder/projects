name: Personal Calendar

on:
  push:
    branches: [main]
    paths:
      - 'Personal-Calendar/**'
      - '.github/workflows/personal-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-calendar-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check Personal-Calendar/app.js
          node --check Personal-Calendar/advanced.js
          node --check Personal-Calendar/sw.js
      - name: Check required files
        run: |
          test -s Personal-Calendar/index.html
          test -s Personal-Calendar/styles.css
          test -s Personal-Calendar/app.js
          test -s Personal-Calendar/advanced.js
          test -s Personal-Calendar/manifest.webmanifest
          test -s Personal-Calendar/sw.js
          test -s Personal-Calendar/icon.svg
          test -s Personal-Calendar/README.md
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('Personal-Calendar/manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Validate product wiring and advanced feature set
        run: |
          grep -q 'app.js' Personal-Calendar/index.html
          grep -q 'advanced.js' Personal-Calendar/index.html
          grep -q 'serviceWorker' Personal-Calendar/app.js
          grep -q 'VEVENT' Personal-Calendar/app.js
          grep -q 'RRULE' Personal-Calendar/app.js
          grep -q 'Find free time' Personal-Calendar/index.html
          grep -q 'local-first' Personal-Calendar/README.md
          grep -q 'openInsights' Personal-Calendar/advanced.js
          grep -q 'openSmart' Personal-Calendar/advanced.js
          grep -q 'openBackups' Personal-Calendar/advanced.js
          grep -q 'commandPalette' Personal-Calendar/advanced.js
          grep -q 'travelMinutes' Personal-Calendar/advanced.js
          grep -q 'exportEnhancedICS' Personal-Calendar/advanced.js
          grep -q 'CATEGORIES' Personal-Calendar/advanced.js
          grep -q 'TRANSP' Personal-Calendar/advanced.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Personal-Calendar
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
