<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><meta name="description" content="Private local-first activity and time logger with live tracking, timeline, goals, reports and backups.">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="activity.css"><title>Activity Logger</title>
</head>
<body>
<div class="app-shell">
<header class="app-header"><div class="brand"><div class="brand-mark">AL</div><div><h1>Activity Logger</h1><p>Know where your time goes.</p></div></div><div class="header-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button><button class="btn" id="exportBtn">Export</button><label class="btn">Import<input id="importInput" type="file" accept="application/json" hidden></label><button class="icon-btn" id="settingsBtn" title="Settings">⚙</button></div></header>
<nav class="tabs" aria-label="Primary navigation"><button class="tab active" data-view="today">Today</button><button class="tab" data-view="timeline">Timeline</button><button class="tab" data-view="reports">Reports</button><button class="tab" data-view="goals">Goals</button><button class="tab" data-view="activities">Activities</button></nav>
<main id="main"></main></div>
<dialog id="entryDialog"><form id="entryForm" class="dialog-form"><div class="dialog-head"><div><h2 id="entryTitle">Log activity</h2><p>Capture a precise record or adjust an existing one.</p></div><button type="button" class="icon-btn" data-close="entryDialog">×</button></div><input type="hidden" id="entryId"><div class="form-grid"><label>Activity<input id="activity" required maxlength="120" placeholder="e.g. Mathematics study"></label><label>Category<select id="category"><option>Work</option><option>Study</option><option>Exercise</option><option>Personal</option><option>Creative</option><option>Social</option><option>Chores</option><option>Errand</option><option>Other</option></select></label><label>Date<input id="date" type="date" required></label><label>Start<input id="start" type="time" required></label><label>End<input id="end" type="time"></label><label>Duration (minutes)<input id="duration" type="number" min="1" max="1440" required></label><label>Context<input id="context" maxlength="120" placeholder="Where, project, or situation"></label><label>Tags<input id="tags" maxlength="250" placeholder="comma, separated, tags"></label><label class="wide">Notes<textarea id="notes" rows="4" maxlength="2000" placeholder="Optional details, outcomes, or observations"></textarea></label></div><div class="dialog-actions"><button type="button" class="btn" data-close="entryDialog">Cancel</button><button class="btn primary" type="submit">Save activity</button></div></form></dialog>
<dialog id="goalDialog"><form id="goalForm" class="dialog-form"><div class="dialog-head"><div><h2>Daily goal</h2><p>Track more time on something valuable.</p></div><button type="button" class="icon-btn" data-close="goalDialog">×</button></div><label>Goal name<input id="goalName" required maxlength="80" placeholder="Focused study"></label><label>Category<select id="goalCategory"><option value="all">All activities</option><option>Work</option><option>Study</option><option>Exercise</option><option>Personal</option><option>Creative</option><option>Social</option><option>Chores</option><option>Errand</option><option>Other</option></select></label><label>Target minutes per day<input id="goalMinutes" type="number" min="1" max="1440" required></label><div class="dialog-actions"><button type="button" class="btn" data-close="goalDialog">Cancel</button><button class="btn primary" type="submit">Save goal</button></div></form></dialog>
<dialog id="settingsDialog"><form id="settingsForm" class="dialog-form"><div class="dialog-head"><div><h2>Settings</h2><p>Keep the logger private and tuned to your workflow.</p></div><button type="button" class="icon-btn" data-close="settingsDialog">×</button></div><label>Default category<select id="defaultCategory"><option>Work</option><option>Study</option><option>Exercise</option><option>Personal</option><option>Creative</option><option>Social</option><option>Chores</option><option>Errand</option><option>Other</option></select></label><label class="switch-row"><span>Confirm archive actions</span><input id="confirmArchive" type="checkbox"></label><label class="switch-row"><span>Desktop notifications</span><input id="notifications" type="checkbox"></label><div class="storage-box"><strong>Local storage</strong><span id="storageInfo">Calculating…</span></div><button type="button" class="btn danger" id="clearDataBtn">Delete all local data</button><div class="dialog-actions"><button class="btn primary" type="submit">Done</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="activity.js"></script>
</body></html>
