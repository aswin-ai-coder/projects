<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Daily Checklist - simple, reusable and local-first daily checklists"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Daily Checklist</title></head>
<body><header class="top"><div><div class="eyebrow">DAILY CHECKLIST</div><h1>Today, one check at a time.</h1><p id="dateLabel"></p></div><div class="top-actions"><button id="themeBtn" class="icon-btn" title="Theme">◐</button><button id="settingsBtn" class="icon-btn" title="Settings">⚙</button></div></header>
<main><section class="hero"><div><span class="pill" id="dayPill">Today</span><h2 id="greeting">Your checklist</h2><p id="summary">Start small. Finish clearly.</p></div><div class="progress-ring" id="ring"><strong id="percent">0%</strong><small>complete</small></div></section>
<section class="quick"><input id="quickAdd" placeholder="Quick add a checklist item… (Enter)" autocomplete="off"><button id="addBtn">Add</button></section>
<section class="toolbar"><div class="tabs"><button class="tab active" data-filter="today">Today</button><button class="tab" data-filter="all">All</button><button class="tab" data-filter="done">Completed</button></div><button id="newListBtn" class="secondary">+ Checklist</button><button id="templateBtn" class="secondary">Templates</button></section>
<div id="lists" class="lists"></div>
<section class="insights" id="insights"></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div>
<script src="app.js"></script><script src="advanced.js"></script></body></html>
