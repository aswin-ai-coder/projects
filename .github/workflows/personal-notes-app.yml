name: Personal Notes App

on:
  push:
    branches: [main]
    paths:
      - 'Personal-Notes-App/**'
      - '.github/workflows/personal-notes-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-notes-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check Personal-Notes-App/app.js
          node --check Personal-Notes-App/advanced.js
      - name: Validate service worker syntax
        run: node --check Personal-Notes-App/sw.js
      - name: Validate required files
        run: |
          test -f Personal-Notes-App/index.html
          test -f Personal-Notes-App/styles.css
          test -f Personal-Notes-App/app.js
          test -f Personal-Notes-App/advanced.js
          test -f Personal-Notes-App/manifest.webmanifest
          test -f Personal-Notes-App/sw.js
          test -f Personal-Notes-App/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('Personal-Notes-App/manifest.webmanifest','utf8'))"
      - name: Validate HTML wiring
        run: |
          grep -q 'styles.css' Personal-Notes-App/index.html
          grep -q 'app.js' Personal-Notes-App/index.html
          grep -q 'advanced.js' Personal-Notes-App/index.html
          grep -q 'manifest.webmanifest' Personal-Notes-App/index.html
          grep -q 'sw.js' Personal-Notes-App/app.js
          grep -q 'advanced.js' Personal-Notes-App/sw.js
      - name: Validate feature markers
        run: |
          grep -q 'Knowledge graph' Personal-Notes-App/advanced.js
          grep -q 'Templates' Personal-Notes-App/advanced.js
          grep -q 'Note properties' Personal-Notes-App/advanced.js
          grep -q 'Storage health' Personal-Notes-App/advanced.js
          grep -q 'Import Markdown' Personal-Notes-App/advanced.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Personal-Notes-App
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
