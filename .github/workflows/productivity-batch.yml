name: Productivity Batch Validation
on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shared JavaScript
        run: node --check _shared/organizer.js
      - name: Validate batch manifest and project apps
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('batch-manifest.json','utf8'));
          if(m.projects.length!==48) throw new Error(`Expected 48 projects, found ${m.projects.length}`);
          for(const p of m.projects){
            const html=`${p}/index.html`, features=`${p}/features.json`;
            if(!fs.existsSync(html)) throw new Error(`Missing ${html}`);
            if(!fs.existsSync(features)) throw new Error(`Missing ${features}`);
            const s=fs.readFileSync(html,'utf8');
            if(!s.includes('../_shared/organizer.js')) throw new Error(`Missing shared JS in ${html}`);
            if(!s.includes('../_shared/organizer.css')) throw new Error(`Missing shared CSS in ${html}`);
            const f=JSON.parse(fs.readFileSync(features,'utf8'));
            if(!Array.isArray(f.features)||f.features.length<5) throw new Error(`Weak feature manifest: ${features}`);
            if(!Array.isArray(f.fields)||f.fields.length<2) throw new Error(`Weak field model: ${features}`);
            if(!f.mode) throw new Error(`Missing mode: ${features}`);
          }
          console.log(`Validated ${m.projects.length} project-specific feature manifests`);
          NODE
      - name: Validate HTML shells
        run: |
          test "$(find . -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 50
          grep -q 'Personal Organizer Suite' Personal-Organizer-Suite/index.html
          grep -q 'Daily Planner' Personal-Organizer-Suite/index.html
          grep -q 'Simple Second Brain' Personal-Organizer-Suite/index.html
      - name: Validate feature diversity
        run: |
          node - <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('batch-manifest.json','utf8'));
          const modes=new Set(m.projects.map(p=>JSON.parse(fs.readFileSync(`${p}/features.json`,'utf8')).mode));
          if(modes.size<4) throw new Error(`Expected at least 4 workflow modes, found ${modes.size}`);
          console.log([...modes].join(', '));
          NODE
