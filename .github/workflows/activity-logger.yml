name: Activity Logger Validation
on:
  push:
    branches: [main]
    paths:
      - 'Activity-Logger/**'
      - '.github/workflows/activity-logger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check Activity-Logger/activity.js
          node --check Activity-Logger/enhancements.js
          node --check Activity-Logger/sw.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('Activity-Logger/manifest.webmanifest','utf8'))"
      - name: Validate required files and wiring
        run: |
          test -f Activity-Logger/index.html
          test -f Activity-Logger/activity.js
          test -f Activity-Logger/activity.css
          test -f Activity-Logger/enhancements.js
          test -f Activity-Logger/features.json
          test -f Activity-Logger/manifest.webmanifest
          test -f Activity-Logger/sw.js
          test -f Activity-Logger/icon.svg
          grep -q 'activity.js' Activity-Logger/index.html
          grep -q 'enhancements.js' Activity-Logger/index.html
          grep -q 'activity.css' Activity-Logger/index.html
          grep -q 'manifest.webmanifest' Activity-Logger/index.html
          grep -q 'serviceWorker' Activity-Logger/activity.js
          grep -q 'data-view="calendar"' Activity-Logger/index.html
          grep -q 'id="favorite"' Activity-Logger/index.html
          grep -q "./enhancements.js" Activity-Logger/sw.js
          grep -q "./icon.svg" Activity-Logger/sw.js
      - name: Validate feature contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('Activity-Logger/features.json','utf8'));
          if(!Array.isArray(f.features)||f.features.length<40) throw new Error('Feature manifest is incomplete');
          if(!Array.isArray(f.fields)||f.fields.length<10) throw new Error('Activity data model is incomplete');
          if(f.mode!=='standalone') throw new Error('Activity Logger must use its standalone implementation');
          if(!f.privacy||!f.limitations?.length) throw new Error('Privacy/technical boundaries missing');
          console.log(`Validated ${f.features.length} features and ${f.fields.length} fields`);
          NODE
      - name: Validate product wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('Activity-Logger/activity.js','utf8');
          const html=fs.readFileSync('Activity-Logger/index.html','utf8');
          for(const token of ['timerStart','timerPause','timerStop','calendar','reports','goals','activities','exportCsv','toggleFavorite','restore']){
            if(!js.includes(token)) throw new Error(`Missing implementation token: ${token}`);
          }
          for(const token of ['today','calendar','timeline','reports','goals','activities']){
            if(!html.includes(`data-view="${token}"`)) throw new Error(`Missing navigation view: ${token}`);
          }
          console.log('Standalone Activity Logger wiring validated');
          NODE