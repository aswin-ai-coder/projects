name: AI Study Assistant CI

on:
  push:
    branches: [main]
    paths: ['ai-study-assistant/**']
  pull_request:
    branches: [main]
    paths: ['ai-study-assistant/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-study-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-study-assistant/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
