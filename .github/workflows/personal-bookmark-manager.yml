name: Personal Bookmark Manager
on:
  push:
    paths:
      - 'Personal-Bookmark-Manager/**'
      - '.github/workflows/personal-bookmark-manager.yml'
  pull_request:
    paths:
      - 'Personal-Bookmark-Manager/**'
      - '.github/workflows/personal-bookmark-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check Personal-Bookmark-Manager/app.js
          node --check Personal-Bookmark-Manager/advanced.js
          node --check Personal-Bookmark-Manager/power-tools.js
          node --check Personal-Bookmark-Manager/sw.js
          node --check Personal-Bookmark-Manager/browser-extension/background.js
          node --check Personal-Bookmark-Manager/browser-extension/popup.js
      - name: Validate required app files
        run: |
          test -s Personal-Bookmark-Manager/index.html
          test -s Personal-Bookmark-Manager/styles.css
          test -s Personal-Bookmark-Manager/app.js
          test -s Personal-Bookmark-Manager/advanced.js
          test -s Personal-Bookmark-Manager/power-tools.js
          test -s Personal-Bookmark-Manager/browser-extension/manifest.json
          test -s Personal-Bookmark-Manager/browser-extension/popup.html
          test -s Personal-Bookmark-Manager/manifest.webmanifest
          grep -q 'Personal Bookmark Manager' Personal-Bookmark-Manager/README.md
          grep -q 'power-tools.js' Personal-Bookmark-Manager/index.html
