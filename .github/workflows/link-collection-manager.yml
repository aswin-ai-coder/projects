name: Link Collection Manager
on:
  push:
    paths:
      - 'Link-Collection-Manager/**'
      - '.github/workflows/link-collection-manager.yml'
  pull_request:
    paths:
      - 'Link-Collection-Manager/**'
      - '.github/workflows/link-collection-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check Link-Collection-Manager/app.js
          node --check Link-Collection-Manager/tools.js
          node --check Link-Collection-Manager/power.js
          node --check Link-Collection-Manager/reading.js
          node --check Link-Collection-Manager/sw.js
          node --check Link-Collection-Manager/browser-extension/background.js
          node --check Link-Collection-Manager/browser-extension/popup.js
      - name: Validate required files
        run: |
          test -s Link-Collection-Manager/index.html
          test -s Link-Collection-Manager/styles.css
          test -s Link-Collection-Manager/app.js
          test -s Link-Collection-Manager/tools.js
          test -s Link-Collection-Manager/power.js
          test -s Link-Collection-Manager/reading.js
          test -s Link-Collection-Manager/sw.js
          test -s Link-Collection-Manager/tools.js
          test -s Link-Collection-Manager/power.js
          test -s Link-Collection-Manager/manifest.webmanifest
          test -s Link-Collection-Manager/browser-extension/manifest.json
          test -s Link-Collection-Manager/browser-extension/popup.html
          test -s Link-Collection-Manager/README.md
          grep -q 'src="power.js"' Link-Collection-Manager/index.html
          grep -q 'src="reading.js"' Link-Collection-Manager/index.html
          grep -q "'./power.js'" Link-Collection-Manager/sw.js
          grep -q "'./reading.js'" Link-Collection-Manager/sw.js
