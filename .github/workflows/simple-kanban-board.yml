name: Simple Kanban Board

on:
  push:
    branches: [main]
    paths:
      - 'Simple-Kanban-Board/**'
      - '.github/workflows/simple-kanban-board.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: simple-kanban-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check Simple-Kanban-Board/app.js
          node --check Simple-Kanban-Board/advanced.js
          node --check Simple-Kanban-Board/attachments.js
          node --check Simple-Kanban-Board/sw.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('Simple-Kanban-Board/manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Validate required files
        run: |
          test -s Simple-Kanban-Board/index.html
          test -s Simple-Kanban-Board/styles.css
          test -s Simple-Kanban-Board/app.js
          test -s Simple-Kanban-Board/advanced.js
          test -s Simple-Kanban-Board/attachments.js
          test -s Simple-Kanban-Board/manifest.webmanifest
          test -s Simple-Kanban-Board/sw.js
          test -s Simple-Kanban-Board/icon.svg
          test -s Simple-Kanban-Board/README.md
      - name: Validate product wiring
        run: |
          grep -q 'manifest.webmanifest' Simple-Kanban-Board/index.html
          grep -q 'app.js' Simple-Kanban-Board/index.html
          grep -q 'advanced.js' Simple-Kanban-Board/index.html
          grep -q 'attachments.js' Simple-Kanban-Board/index.html
          grep -q 'serviceWorker' Simple-Kanban-Board/app.js
          grep -q 'dragstart' Simple-Kanban-Board/app.js
          grep -q 'WIP' Simple-Kanban-Board/app.js
          grep -q 'checklist' Simple-Kanban-Board/app.js
          grep -q 'exportData' Simple-Kanban-Board/app.js
          grep -q 'analytics' Simple-Kanban-Board/app.js
          grep -q 'activity' Simple-Kanban-Board/app.js
          grep -q 'Table view' Simple-Kanban-Board/advanced.js
          grep -q 'Timeline / roadmap' Simple-Kanban-Board/advanced.js
          grep -q 'Dependencies' Simple-Kanban-Board/advanced.js
          grep -q 'Automation rules' Simple-Kanban-Board/advanced.js
          grep -q 'Flow metrics' Simple-Kanban-Board/advanced.js
          grep -q 'Bulk operations' Simple-Kanban-Board/advanced.js
          grep -q 'Saved views' Simple-Kanban-Board/advanced.js
          grep -q 'Export CSV' Simple-Kanban-Board/advanced.js
          grep -q 'indexedDB' Simple-Kanban-Board/attachments.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Simple-Kanban-Board
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
