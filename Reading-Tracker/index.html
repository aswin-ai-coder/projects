<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Reading Tracker</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div><p class="eyebrow">READING TRACKER</p><h1>Your reading life, in one place.</h1><p class="sub">Track your library, sessions, goals, notes and reading patterns privately.</p></div><div class="actions"><button id="themeBtn">Theme</button><button id="studioBtn" class="primary">Reading Studio</button></div></header><main><section class="hero"><div><span class="label">TODAY</span><strong id="todayMinutes">0 min</strong><small id="todayPages">0 pages</small></div><div class="ring" id="goalRing"><span id="goalPct">0%</span></div><div class="heroRight"><span class="label">YEAR GOAL</span><strong id="yearProgress">0 / 12</strong><small id="paceText">Set a goal</small></div></section><section class="quick"><input id="search" placeholder="Search title, author, notes, tags…"><select id="status"><option value="all">All books</option><option>Want to Read</option><option>Currently Reading</option><option>Read</option><option>DNF</option><option>Owned</option></select><button id="addBook" class="primary">+ Add book</button><button id="startSession">Log session</button></section><nav class="tabs"><button class="tab active" data-view="dashboard">Dashboard</button><button class="tab" data-view="library">Library</button><button class="tab" data-view="sessions">Sessions</button><button class="tab" data-view="stats">Stats</button><button class="tab" data-view="goals">Goals</button></nav><section id="view"></section></main><dialog id="modal"><div id="modalBody"></div></dialog><script src="app.js"></script><script src="advanced.js"></script><script src="enhancements.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
