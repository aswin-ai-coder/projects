<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Personal Journal — private, local-first daily journaling workspace"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"><title>Personal Journal</title></head><body>
<header class="topbar"><div class="brand"><div class="logo">J</div><div><strong>Personal Journal</strong><span id="todayLabel"></span></div></div><div class="top-actions"><button id="newBtn" class="primary">+ New entry</button><button id="promptBtn" title="Daily prompt">Prompt</button><button id="themeBtn" title="Toggle theme">Theme</button><button id="settingsBtn" title="Settings">Settings</button></div></header>
<main class="shell"><section class="hero"><div><p class="eyebrow">YOUR PRIVATE SPACE</p><h1>Write what matters.</h1><p id="heroSub">A calm place for thoughts, memories, gratitude and reflection.</p></div><div class="hero-stats"><div><b id="streakStat">0</b><span>day streak</span></div><div><b id="entryStat">0</b><span>entries</span></div><div><b id="wordStat">0</b><span>words</span></div></div></section>
<nav class="tabs" aria-label="Journal views"><button class="tab active" data-view="timeline">Timeline</button><button class="tab" data-view="calendar">Calendar</button><button class="tab" data-view="favorites">Favorites</button><button class="tab" data-view="onthisday">On this day</button><button class="tab" data-view="insights">Insights</button></nav>
<section class="toolbar"><input id="search" placeholder="Search entries, tags, moods…" autocomplete="off"><select id="journalFilter"><option value="all">All journals</option></select><select id="tagFilter"><option value="all">All tags</option></select><select id="moodFilter"><option value="all">All moods</option></select><button id="clearSearch">Clear</button></section>
<section id="view"></section></main>
<div id="editor" class="modal hidden"><div class="dialog editor-dialog"><div class="dialog-head"><div><span class="eyebrow">JOURNAL ENTRY</span><h2 id="editorTitle">New entry</h2></div><button data-close>×</button></div><div class="entry-meta"><input id="entryDate" type="date"><input id="entryTime" type="time"><select id="entryMood"><option value="">Mood</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Rough</option></select><input id="entryWeather" placeholder="Weather (optional)"><input id="entryLocation" placeholder="Location (optional)"></div><input id="entryTitle" class="title-input" placeholder="Give this entry a title…"><div class="formatbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button><button data-cmd="formatBlock" data-value="h2">Heading</button><button data-cmd="createLink">Link</button></div><div id="entryBody" class="editor" contenteditable="true" spellcheck="true"></div><div class="entry-bottom"><input id="entryTags" placeholder="Tags, comma separated"><label><input id="entryFavorite" type="checkbox"> Favorite</label><label><input id="entryPrivate" type="checkbox"> Private note</label></div><div class="dialog-actions"><button id="deleteEntry" class="danger hidden">Delete</button><span></span><button data-close>Cancel</button><button id="saveEntry" class="primary">Save entry</button></div></div></div>
<div id="smallModal" class="modal hidden"><div class="dialog"><div class="dialog-head"><h2 id="smallTitle"></h2><button data-close>×</button></div><div id="smallBody"></div></div></div>
<div id="toast" class="toast"></div><script src="./app.js"></script><script src="./advanced.js"></script></body></html>
