<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="A private, local-first movie library, watchlist and diary.">
<meta name="color-scheme" content="light dark">
<title>Movie Watchlist — Your cinema library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="eyebrow">PRIVATE · LOCAL-FIRST</span><h1>Movie Watchlist</h1><p>Your personal cinema library, diary and decision engine.</p></div>
  <div class="actions"><button id="add" class="primary">+ Add movie</button><button id="theme">Theme</button><button id="studio">Power tools</button></div>
</header>
<nav class="tabs" aria-label="Primary navigation">
  <button data-view="home" class="active">Home</button><button data-view="watchlist">Watchlist</button><button data-view="watched">Watched</button><button data-view="diary">Diary</button><button data-view="lists">Lists</button><button data-view="stats">Stats</button>
</nav>
<main>
  <section class="toolbar">
    <input id="search" aria-label="Search movies" placeholder="Search title, director, cast, genre, tag…">
    <select id="filter" aria-label="Filter"><option value="all">All</option><option>Watchlist</option><option>Watched</option><option>DNF</option><option>Favorite</option><option>Rewatch</option><option>Unrated</option><option>Owned</option></select>
    <select id="sort" aria-label="Sort"><option value="added">Recently added</option><option value="title">Title A–Z</option><option value="rating">My rating</option><option value="year">Release year</option><option value="runtime">Runtime</option><option value="priority">Priority</option><option value="watched">Watched date</option></select>
    <button id="clearSearch" title="Clear search">Clear</button>
  </section>
  <section id="view" aria-live="polite"></section>
</main>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script src="app.js"></script><script src="advanced.js"></script><script src="enhancements.js"></script><script src="power.js"></script>
</body>
</html>
