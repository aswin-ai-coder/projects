name: Deploy Personal Task Manager

on:
  push:
    branches: [main]
    paths:
      - 'Personal-Task-Manager/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload project
        uses: actions/upload-pages-artifact@v4
        with:
          path: './Personal-Task-Manager'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
