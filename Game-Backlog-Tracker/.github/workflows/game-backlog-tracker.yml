name: Game Backlog Tracker
on:
  push:
    branches: [main]
    paths: ['Game-Backlog-Tracker/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-game-backlog
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Game-Backlog-Tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check app.js && node --check power.js && node --check sw.js && node --check sw-register.js
      - name: Validate product files
        run: test -s index.html && test -s styles.css && test -s manifest.webmanifest && test -s icon.svg
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Game-Backlog-Tracker
      - id: deployment
        uses: actions/deploy-pages@v4